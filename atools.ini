--[[
A-Tools v1.1 for Radmir CRMP
Автор: Roman / Исправления: Gemini

Функции:
- Админ-чекер (/admins)
- Репорт монитор (10 последних)
- Ключевые слова (редактируются)
- Автоответчик
- Чекер нормы
- Сброс в 00:00
- Changelog при первом запуске
]]

script_name("A-Tools v1.1")
script_author("Plekhan")

function log(text)
    print("[A-Tools] "..text)
end

require 'lib.moonloader'
local sampev = require 'lib.samp.events' -- Обязательная либа для перехвата чата
local imgui = require 'imgui'
local encoding = require 'encoding'
local json = require 'dkjson'

encoding.default = 'CP1251'
u8 = encoding.UTF8

local configFile = getWorkingDirectory()..'/moonloader/config/atools.json'

local config = {
    norm = 100,
    showChangelog = true,
    reportKeywords = {
        "оск","чит","хелп","help","помоги","дм",
        "таран","встречка","помогите","застрял"
    },
    autoAnswers = {
        {key="хелп", text="Иду на помощь, ожидайте"},
        {key="дм", text="Слежу за нарушителем"},
        {key="оск", text="Уже проверяю чат"}
    }
}

local reports = {}
local admins = {}
local answersCount = 0
local lastDay = os.date("%d")

local menuOpen = imgui.ImBool(false)
local changelogOpen = imgui.ImBool(false)
local addWordWindow = imgui.ImBool(false)
local wordBuffer = imgui.ImBuffer(64)

local adminAuthorized = false

-- ================= CONFIG =================

function saveConfig()
    local f = io.open(configFile, "w+")
    if f then
        f:write(json.encode(config, {indent=true}))
        f:close()
    end
end

function loadConfig()
    local f = io.open(configFile, "r")
    if f then
        local data = f:read("*a")
        f:close()
        local ok, decoded = pcall(json.decode, data)
        if ok and decoded then
            config = decoded
        end
    end
end

-- ================= UTILS =================

function reportExists(id)
    for _, r in ipairs(reports) do
        if tonumber(r.id) == tonumber(id) then
            return true
        end
    end
    return false
end

function isKeyword(msg)
    msg = msg:lower()
    for _, word in ipairs(config.reportKeywords) do
        if msg:find(word, 1, true) then
            return true
        end
    end
    return false
end

function getMyNick()
    local result, myId = sampGetPlayerIdByCharHandle(PLAYER_PED)
    if result then
        return sampGetPlayerNickname(myId)
    end
    return ""
end

-- ================= MAIN =================

function main()
    if not isSampLoaded() or not isSampfuncsLoaded() then return end
    while not isSampAvailable() do wait(100) end

    log("A-Tools запущен. Ожидаем авторизацию...")
    loadConfig()

    -- Регистрация команд
    sampRegisterChatCommand("atools", function()
        if not adminAuthorized then
            sampAddChatMessage("[A-Tools] Вы еще не авторизовались!", 0xFF0000)
            return
        end
        menuOpen.v = not menuOpen.v
    end)

    sampRegisterChatCommand("adminscheck", function()
        if not adminAuthorized then return end
        sampSendChat("/admins")
    end)

    while true do
        wait(0) -- Нулевая задержка для работы ImGui

        -- Привязываем окна ImGui к циклу
        imgui.Process = menuOpen.v or changelogOpen.v or addWordWindow.v

        local currentDay = os.date("%d")
        if currentDay ~= lastDay then
            answersCount = 0
            lastDay = currentDay
            saveConfig()
        end
    end
end

-- ================= UI =================

function imgui.OnDrawFrame()

    -- CHANGELOG
    if changelogOpen.v then
        imgui.Begin(u8"A-Tools v1.1", changelogOpen)
        imgui.Text(u8"Список изменений:")
        imgui.Separator()
        imgui.Text(u8"✔️ Админ-чекер")
        imgui.Text(u8"✔️ Репорт монитор")
        imgui.Text(u8"✔️ 10 последних репортов")
        imgui.Text(u8"✔️ Ключевые слова")
        imgui.Text(u8"✔️ Чекер нормы")
        imgui.Text(u8"✔️ Сброс в 00:00")
        imgui.Text(u8"✔️ Автоответчик")

        if imgui.Button(u8"Закрыть") then
            changelogOpen.v = false
            config.showChangelog = false
            saveConfig()
        end
        imgui.End()
    end

    -- ОСНОВНОЕ МЕНЮ
    if menuOpen.v then
        imgui.Begin(u8"A-Tools v1.1", menuOpen)

        if imgui.Button(u8"Список изменений") then
            changelogOpen.v = true
        end

        -- НОРМА
        if imgui.CollapsingHeader(u8"Чекер нормы") then
            _, config.norm = imgui.InputInt(u8"Норма", config.norm)
            imgui.Text(u8("Ответов: "..answersCount))
            imgui.Text(u8("Осталось: "..(config.norm - answersCount)))

            local percent = 0
            if config.norm > 0 then
                percent = answersCount / config.norm
            end
            imgui.ProgressBar(percent, imgui.ImVec2(200,20))
        end

        -- РЕПОРТЫ
        if imgui.CollapsingHeader(u8"Репорт монитор") then
            for i, r in ipairs(reports) do
                imgui.Text(r.nick.." ["..r.id.."] → "..r.text)
                imgui.SameLine()
                if imgui.SmallButton("X##rep"..i) then
                    table.remove(reports, i)
                    break
                end
                imgui.SameLine()
                if imgui.Button("SP##"..i) then
                    sampSendChat("/sp "..r.id)
                end
                imgui.SameLine()
                if imgui.Button("PM##"..i) then
                    sampSendChat("/pm "..r.id.." Помогаю")
                end
            end
        end

        -- КЛЮЧЕВЫЕ СЛОВА
        if imgui.CollapsingHeader(u8"Ключевые слова") then
            for i, word in ipairs(config.reportKeywords) do
                imgui.Text(word)
                imgui.SameLine()
                if imgui.SmallButton("X##key"..i) then
                    table.remove(config.reportKeywords, i)
                    saveConfig()
                    break
                end
            end
            if imgui.Button(u8"Добавить слово") then
                addWordWindow.v = true
            end
        end

        -- АДМИНЫ
        if imgui.CollapsingHeader(u8"Админ-чекер") then
            if imgui.Button(u8"Обновить") then
                sampSendChat("/admins")
            end
            imgui.Text(u8("Админов: "..#admins))
            for _, a in ipairs(admins) do
                imgui.Text(a)
            end
        end

        if imgui.Button(u8"Сохранить") then
            saveConfig()
        end
        imgui.End()
    end

    -- ДОБАВЛЕНИЕ СЛОВА
    if addWordWindow.v then
        imgui.Begin(u8"Новое слово", addWordWindow)
        imgui.InputText(u8"Слово", wordBuffer)

        if imgui.Button(u8"Добавить") then
            table.insert(config.reportKeywords, wordBuffer.v)
            wordBuffer.v = ""
            saveConfig()
            addWordWindow.v = false
        end
        imgui.SameLine()
        if imgui.Button(u8"Отмена") then
            addWordWindow.v = false
        end
        imgui.End()
    end
end

-- ================= CHAT EVENTS =================

function sampev.onServerMessage(color, text)
    -- Очищаем текст от HEX-цветов (например, {FFFFFF})
    local cleanText = text:gsub("{%x+}", "")

    -- Авторизация
    if cleanText:find("Вы вошли как администратор") then
        adminAuthorized = true
        log("Администратор авторизован")
        sampAddChatMessage("[A-Tools] Успешная авторизация. Введите /atools", 0x00FF00)
        
        if config.showChangelog then
            changelogOpen.v = true
        end
    end

    if not adminAuthorized then return end

    -- Поимка репортов
    local prefix, nick, id, msg = cleanText:match("%[(.-)%]%s+(.-)%s+%[(%d+)%]:%s+(.+)")
    if not prefix then
        -- Альтернативный паттерн на случай других пробелов
        prefix, nick, id, msg = cleanText:match("%[(.-)%]%s+(.+) %[(%d+)%]: (.+)")
    end

    if prefix and nick and id and msg then
        if isKeyword(msg) and not reportExists(id) then
            -- Добавляем в лог имгуи
            table.insert(reports, 1, {
                nick = nick,
                id = id,
                text = msg
            })
            if #reports > 10 then table.remove(reports) end

            -- Проверка на автоответчик
            for _, ans in ipairs(config.autoAnswers) do
                if msg:lower():find(ans.key:lower(), 1, true) then
                    -- Создаем поток, чтобы сделать небольшую задержку (имитация печати)
                    lua_thread.create(function()
                        wait(1500) 
                        sampSendChat("/pm " .. id .. " " .. ans.text)
                    end)
                    break
                end
            end
        end
    end

    -- Засчитывание своей нормы ответов и удаление из панели
    local adminNick, playerNick, playerId = cleanText:match("Администратор (.-)%[%d+%] для (.-) %[(%d+)%]:")
    if adminNick and playerId then
        if adminNick == getMyNick() then
            answersCount = answersCount + 1
            saveConfig()
            
            for i = #reports, 1, -1 do
                if tonumber(reports[i].id) == tonumber(playerId) then
                    table.remove(reports, i)
                end
            end
        end
    end

    -- Чекер онлайна админов
    if cleanText:find("Админы онлайн") then
        admins = {}
    end

    local nick2, id2, lvl2 = cleanText:match("(.-)%[(%d+)%] %((%d+) lvl%)")
    if nick2 and id2 and lvl2 then
        table.insert(admins, nick2.." ["..id2.."] "..lvl2.." lvl")
    end
end

function onScriptTerminate()
    saveConfig()
end
